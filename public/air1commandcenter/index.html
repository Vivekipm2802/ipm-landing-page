  <body>
    <div id="root"></div>

    <!-- =====================================================
         EXAM DEADLINE NOTIFICATION BELL
         Injected script — adds bell icons to each Open exam
         card in the Forms tab, and handles the subscribe flow.
    ====================================================== -->
    <style>
      /* === MOBILE HORIZONTAL SCROLL FIX ===
         touch-action:pan-y  → iOS only allows vertical finger panning on body
         overscroll-behavior-x:none → prevents horizontal scroll chaining to parent
         These two together stop the tab bar swipe from shifting the page sideways */
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
        overscroll-behavior-x: none;
        touch-action: pan-y;
      }
      #root {
        overflow-x: hidden;
        max-width: 100vw;
      }
      /* Allow the tab bar to scroll internally but contain it */
      .overflow-x-auto {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
      }
      /* Neutralise the -mx-2 negative margin that bleeds outside parent */
      .overflow-x-auto[class*="-mx-"] {
        margin-left: 0 !important;
        margin-right: 0 !important;
      }
      * { box-sizing: border-box; }
      /* Bell button on each card */
      .ipm-bell-btn {
        position: absolute;
        top: 14px;
        right: 52px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(249,160,27,0.12);
        border: 1px solid rgba(249,160,27,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        z-index: 10;
      }
      @media (max-width: 640px) {
        .ipm-bell-btn {
          top: 12px;
          right: 12px;
          width: 34px;
          height: 34px;
        }
      }
      .ipm-bell-btn:hover {
        background: rgba(249,160,27,0.25);
        border-color: rgba(249,160,27,0.7);
        transform: scale(1.1);
      }
      .ipm-bell-btn.subscribed {
        background: rgba(34,197,94,0.15);
        border-color: rgba(34,197,94,0.5);
      }
      .ipm-bell-btn svg { width: 17px; height: 17px; }

      /* Modal overlay */
      #ipm-notify-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        backdrop-filter: blur(4px);
        z-index: 9999;
        align-items: center;
        justify-content: center;
      }
      #ipm-notify-overlay.open { display: flex; }

      /* Modal box */
      #ipm-notify-modal {
        background: #0f1117;
        border: 1px solid #1e2533;
        border-radius: 20px;
        padding: 28px 24px;
        width: 92%;
        max-width: 420px;
        position: relative;
        animation: ipm-slide-up 0.25s ease;
        margin: 0 auto;
      }
      @media (max-width: 640px) {
        #ipm-notify-modal {
          width: 96%;
          padding: 24px 18px;
          border-radius: 16px;
        }
        .ipm-modal-btns { flex-direction: column; }
        #ipm-notify-cancel { flex: none; }
        #ipm-notify-submit { flex: none; }
      }
      @keyframes ipm-slide-up {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      #ipm-notify-modal h2 {
        font-size: 18px;
        font-weight: 700;
        color: #f1f5f9;
        margin: 0 0 6px 0;
      }
      #ipm-notify-modal p {
        font-size: 13px;
        color: #64748b;
        margin: 0 0 20px 0;
        line-height: 1.5;
      }
      .ipm-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }
      .ipm-chip {
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: rgba(249,160,27,0.1);
        border: 1px solid rgba(249,160,27,0.25);
        color: #f9a01b;
      }
      #ipm-notify-modal label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #94a3b8;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #ipm-notify-email {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid #1e2533;
        background: #0a0c14;
        color: #f1f5f9;
        font-size: 14px;
        font-family: Inter, sans-serif;
        outline: none;
        margin-bottom: 16px;
        transition: border-color 0.2s;
      }
      #ipm-notify-email:focus { border-color: #f9a01b; }
      #ipm-notify-email::placeholder { color: #334155; }
      .ipm-modal-btns {
        display: flex;
        gap: 10px;
      }
      #ipm-notify-cancel {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #1e2533;
        background: transparent;
        color: #64748b;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: Inter, sans-serif;
        transition: all 0.2s;
      }
      #ipm-notify-cancel:hover { border-color: #334155; color: #94a3b8; }
      #ipm-notify-submit {
        flex: 2;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #f9a01b;
        color: #0a0c14;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        font-family: Inter, sans-serif;
        transition: all 0.2s;
      }
      #ipm-notify-submit:hover { background: #e08e15; }
      #ipm-notify-submit:disabled { opacity: 0.6; cursor: not-allowed; }
      #ipm-notify-msg {
        margin-top: 12px;
        font-size: 13px;
        text-align: center;
        min-height: 18px;
      }
      #ipm-notify-msg.success { color: #22c55e; }
      #ipm-notify-msg.error   { color: #ef4444; }
      .ipm-close-x {
        position: absolute;
        top: 16px; right: 16px;
        width: 28px; height: 28px;
        border-radius: 50%;
        border: none;
        background: #1e2533;
        color: #64748b;
        font-size: 16px;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        line-height: 1;
      }
      .ipm-close-x:hover { background: #334155; color: #f1f5f9; }
    </style>

    <!-- Modal HTML -->
    <div id="ipm-notify-overlay">
      <div id="ipm-notify-modal">
        <button class="ipm-close-x" id="ipm-close-modal">×</button>
        <h2 id="ipm-modal-title">Get Deadline Reminders</h2>
        <p id="ipm-modal-subtitle">We'll email you before the deadline so you never miss applying.</p>
        <div class="ipm-chips">
          <span class="ipm-chip">7 days before</span>
          <span class="ipm-chip">3 days before</span>
          <span class="ipm-chip">1 day before</span>
          <span class="ipm-chip">On the deadline</span>
        </div>
        <label for="ipm-notify-email">Your Gmail Address</label>
        <input type="email" id="ipm-notify-email" placeholder="yourname@gmail.com" autocomplete="email" />
        <div class="ipm-modal-btns">
          <button id="ipm-notify-cancel">Exit</button>
          <button id="ipm-notify-submit">Notify Me ✓</button>
        </div>
        <div id="ipm-notify-msg"></div>
      </div>
    </div>

    <script>
    (function () {
      // ── State ──────────────────────────────────────────────────
      let activeExam = null;   // { name, lastDate }
      const STORE_KEY = 'ipm_bell_subscribed'; // localStorage key

      function getSubscribed() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
        catch { return {}; }
      }
      function markSubscribed(examName) {
        const s = getSubscribed(); s[examName] = true;
        localStorage.setItem(STORE_KEY, JSON.stringify(s));
      }

      // ── Bell SVG ───────────────────────────────────────────────
      function bellSVG(subscribed) {
        const color = subscribed ? '#22c55e' : '#f9a01b';
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          ${subscribed ? '<circle cx="18" cy="6" r="4" fill="#22c55e" stroke="none"/>' : ''}
        </svg>`;
      }

      // ── Add bell to a single card ──────────────────────────────
      function addBellToCard(card) {
        if (card.querySelector('.ipm-bell-btn')) return; // already added

        const h3 = card.querySelector('h3');
        if (!h3) return;
        const examName = h3.textContent.trim();

        // Get last date
        const rows = Array.from(card.querySelectorAll('.flex.items-center.justify-between'));
        const lastDateRow = rows.find(r => r.querySelector('span')?.textContent?.includes('Last Date'));
        const lastDate = lastDateRow
          ? lastDateRow.querySelectorAll('span')[1]?.textContent?.trim()
          : 'To be announced';

        // Check status — only show bell for Open or Coming Soon cards
        const statusRow = rows[rows.length - 1];
        const statusText = statusRow?.textContent?.toLowerCase() || '';
        if (statusText.includes('closed')) return; // don't add bell to closed

        const subscribed = getSubscribed()[examName];

        const btn = document.createElement('button');
        btn.className = 'ipm-bell-btn' + (subscribed ? ' subscribed' : '');
        btn.title = subscribed ? 'You\'re subscribed!' : 'Get deadline reminders';
        btn.innerHTML = bellSVG(subscribed);
        btn.addEventListener('click', () => openModal(examName, lastDate, btn));
        card.style.position = 'relative';
        card.appendChild(btn);
      }

      // ── Scan for new cards (called by observer) ────────────────
      function scanCards() {
        document.querySelectorAll('.rounded-3xl.p-8').forEach(addBellToCard);
      }

      // ── Modal open/close ───────────────────────────────────────
      const overlay  = document.getElementById('ipm-notify-overlay');
      const titleEl  = document.getElementById('ipm-modal-title');
      const subEl    = document.getElementById('ipm-modal-subtitle');
      const emailEl  = document.getElementById('ipm-notify-email');
      const submitBtn = document.getElementById('ipm-notify-submit');
      const msgEl    = document.getElementById('ipm-notify-msg');

      function openModal(examName, lastDate, bellBtn) {
        activeExam = { name: examName, lastDate, bellBtn };
        titleEl.textContent = examName;
        subEl.textContent = `Last date to apply: ${lastDate}. We'll remind you in time.`;
        emailEl.value = '';
        msgEl.textContent = '';
        msgEl.className = '';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Notify Me ✓';
        overlay.classList.add('open');
        setTimeout(() => emailEl.focus(), 100);
      }

      function closeModal() {
        overlay.classList.remove('open');
        activeExam = null;
      }

      document.getElementById('ipm-close-modal').addEventListener('click', closeModal);
      document.getElementById('ipm-notify-cancel').addEventListener('click', closeModal);
      overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

      // ── Submit ─────────────────────────────────────────────────
      submitBtn.addEventListener('click', async () => {
        const email = emailEl.value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          msgEl.textContent = 'Please enter a valid email address.';
          msgEl.className = 'error';
          return;
        }
        if (!activeExam) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving…';
        msgEl.textContent = '';

        try {
          const res = await fetch('/api/exam-notify-subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email,
              examName: activeExam.name,
              lastDate: activeExam.lastDate,
            }),
          });
          const data = await res.json();

          if (res.ok) {
            msgEl.textContent = '✓ Done! You\'ll get reminders before the deadline.';
            msgEl.className = 'success';
            markSubscribed(activeExam.name);
            // Update the bell icon
            if (activeExam.bellBtn) {
              activeExam.bellBtn.classList.add('subscribed');
              activeExam.bellBtn.innerHTML = bellSVG(true);
              activeExam.bellBtn.title = 'You\'re subscribed!';
            }
            setTimeout(closeModal, 2200);
          } else {
            msgEl.textContent = data.error || 'Something went wrong. Please try again.';
            msgEl.className = 'error';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Notify Me ✓';
          }
        } catch (err) {
          msgEl.textContent = 'Network error. Please try again.';
          msgEl.className = 'error';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Notify Me ✓';
        }
      });

      // ── Enter key submits ──────────────────────────────────────
      emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });

      // ── MutationObserver — watches for React rendering cards ───
      const observer = new MutationObserver(() => scanCards());
      observer.observe(document.getElementById('root'), {
        childList: true,
        subtree: true,
      });

      // Also run once after a short delay in case app already rendered
      setTimeout(scanCards, 800);
      setTimeout(scanCards, 2000);
    })();
    </script>
  </body>
